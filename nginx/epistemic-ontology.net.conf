# nginx server config for https://www.epistemic-ontology.net/
#
# Serves the static site and makes ontology IRIs dereferenceable with RDF
# content negotiation. Place at /etc/nginx/sites-available/ and symlink into
# sites-enabled/, or drop into /etc/nginx/conf.d/.
#
# Web root assumed at /var/www/epistemic-ontology/site  (adjust `root` below).
# TLS via certbot:  sudo certbot --nginx -d epistemic-ontology.net -d www.epistemic-ontology.net

# --- Correct media types for RDF serializations -----------------------------
# (nginx ships no defaults for these; without them .ttl is served as text/plain)
types {
    text/turtle                         ttl;
    application/rdf+xml                 rdf owl;
    application/ld+json                 jsonld;
    application/n-triples               nt;
    application/trig                    trig;
}

# --- Content negotiation for the record-harm namespace IRI -------------------
# Map the client's Accept header to the serialization to return when the bare
# namespace IRI (no extension) is requested. Default is HTML documentation.
map $http_accept $rho_repr {
    default                             "/record-harm/";
    "~*text/turtle"                     "/record-harm/record-harm-ontology.ttl";
    "~*application/rdf\+xml"            "/record-harm/record-harm-ontology.ttl";
    "~*application/ld\+json"            "/record-harm/record-harm-ontology.ttl";
    "~*application/n-triples"           "/record-harm/record-harm-ontology.ttl";
}

# --- Content negotiation for the record namespace IRI -----------------------
map $http_accept $rec_repr {
    default                             "/record/";
    "~*text/turtle"                     "/record/record-ontology.ttl";
    "~*application/rdf\+xml"            "/record/record-ontology.ttl";
    "~*application/ld\+json"            "/record/record-ontology.ttl";
    "~*application/n-triples"           "/record/record-ontology.ttl";
}

# --- Canonicalize the apex to www -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name epistemic-ontology.net;
    # certbot will add the :443 variant; keep the redirect target on https.
    return 301 https://www.epistemic-ontology.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.epistemic-ontology.net;

    root /var/www/epistemic-ontology/site;
    index index.html;

    charset utf-8;

    # Hash-namespace dereferencing: a request for the term document IRI
    # `/record-harm` (no trailing slash, no extension) negotiates a
    # representation. `/record-harm/` keeps serving the HTML landing page.
    location = /record-harm {
        return 303 $rho_repr;
    }

    # Same hash-namespace dereferencing for the Record Ontology.
    location = /record {
        return 303 $rec_repr;
    }

    # Serve .ttl etc. with a UTF-8 charset and CORS so RDF tooling in browsers
    # (and import-by-URL from other ontologies) can fetch them.
    location ~ \.(ttl|rdf|owl|jsonld|nt|trig)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Disposition "inline";
        default_type text/turtle;  # overridden by the `types` block per-extension
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Small, cache-friendly static assets.
    location = /style.css {
        add_header Cache-Control "public, max-age=3600";
    }
}

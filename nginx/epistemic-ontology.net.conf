# nginx config for epistemic-ontology.net (+ .org and www variants)
#
# Serves the static site AND makes the ontology namespace IRIs dereferenceable
# with RDF content negotiation. Drop in as a server config included from the
# main nginx.conf `http { }` block (standard sites-available / conf.d layout,
# where `include mime.types;` is already in effect).
#
# Canonical host: https://epistemic-ontology.net (the apex). The other three
# names (www, .org, www.org) 301-redirect to it. The namespace IRIs minted at
# www.epistemic-ontology.net therefore resolve via one permanent 301 to the apex
# and then the 303 content negotiation.
#
# TLS: the certificate covers all four names
#   (epistemic-ontology.net, www.epistemic-ontology.net,
#    epistemic-ontology.org, www.epistemic-ontology.org).

# --- Accept header -> serialization, per namespace IRI ----------------------
# Default is the HTML documentation directory; RDF media types get the Turtle.
# 303 (not 302): the namespace IRI names an ontology, not a document -- "the
# thing you asked about is not a document, but here is a document about it".
map $http_accept $rho_repr {
    default                             "/record-harm/";
    "~*text/turtle"                     "/record-harm/record-harm-ontology.ttl";
    "~*application/rdf\+xml"            "/record-harm/record-harm-ontology.ttl";
    "~*application/ld\+json"            "/record-harm/record-harm-ontology.ttl";
    "~*application/n-triples"           "/record-harm/record-harm-ontology.ttl";
}
map $http_accept $rec_repr {
    default                             "/record/";
    "~*text/turtle"                     "/record/record-ontology.ttl";
    "~*application/rdf\+xml"            "/record/record-ontology.ttl";
    "~*application/ld\+json"            "/record/record-ontology.ttl";
    "~*application/n-triples"           "/record/record-ontology.ttl";
}
map $http_accept $arith_repr {
    default                             "/arith/";
    "~*text/turtle"                     "/arith/arith.ttl";
    "~*application/rdf\+xml"            "/arith/arith.ttl";
    "~*application/ld\+json"            "/arith/arith.ttl";
    "~*application/n-triples"           "/arith/arith.ttl";
}

# --- HTTP (and bare IP) -> canonical HTTPS apex -----------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://epistemic-ontology.net$request_uri;
}

# --- HTTPS, non-canonical names -> 301 to the apex --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.epistemic-ontology.net
                epistemic-ontology.org www.epistemic-ontology.org;

    ssl_certificate     /etc/letsencrypt/live/epistemic-ontology.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epistemic-ontology.net/privkey.pem;

    return 301 https://epistemic-ontology.net$request_uri;
}

# --- HTTPS, canonical apex: serves the site + dereferenceable IRIs ----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name epistemic-ontology.net;

    ssl_certificate     /etc/letsencrypt/live/epistemic-ontology.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epistemic-ontology.net/privkey.pem;

    root /var/www/html;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Conservative hardening. No CSP frame-ancestors override is set here so the
    # RDF stays embeddable by third-party tooling; adjust if that changes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/turtle application/xml application/atom+xml
               application/rdf+xml application/ld+json application/n-triples
               application/javascript image/svg+xml;

    # --- Hash-namespace dereferencing --------------------------------------
    # A bare term-document IRI (no trailing slash, no extension) negotiates a
    # representation; `/record/`, `/arith/` and `/record-harm/` keep serving the
    # HTML documentation.
    location = /record-harm { return 303 $rho_repr; }
    location = /record      { return 303 $rec_repr; }
    location = /arith       { return 303 $arith_repr; }

    # Every worked example declares its own permanent IRI, systematically:
    #   https://www.epistemic-ontology.net/record/examples/<name>#
    # Make those dereference to the Turtle. There is no per-example HTML page,
    # so this answers every Accept header with the RDF.
    location ~ "^/record/examples/([a-z0-9-]+)$" {
        return 303 /record/examples/$1.ttl;
    }

    # --- Moved files (kept permanently) ------------------------------------
    # The two examples that used to sit directly under /record/ before they were
    # regrouped under /record/examples/. Old links keep working.
    location = /record/cogito.ttl {
        return 301 /record/examples/cogito.ttl;
    }
    location = /record/historical-narrative.ttl {
        return 301 /record/examples/historical-narrative.ttl;
    }

    # --- RDF serializations -------------------------------------------------
    # Correct media type (nginx ships none for these, so they would otherwise be
    # text/plain), UTF-8, and CORS so RDF tooling in browsers and import-by-URL
    # from other ontologies can fetch them. The `types` block is scoped to this
    # location, so it does NOT disturb the global mime.types used for
    # .html/.css/.png/.ico.
    location ~ \.(ttl|rdf|owl|jsonld|nt|trig)$ {
        types {
            text/turtle                 ttl;
            application/rdf+xml         rdf owl;
            application/ld+json         jsonld;
            application/n-triples       nt;
            application/trig            trig;
        }
        # NOTE: an add_header in a location REPLACES every add_header inherited
        # from the server block, so the server-level headers are repeated in
        # each location that defines any of its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /feed.xml {
        types { } default_type "application/atom+xml; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=1800" always;
    }
    location = /sitemap.xml {
        types { } default_type "application/xml; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free assets: short cache, so a deploy is visible promptly.
    location = /style.css {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location ~* \.(png|ico|svg|woff2)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
}

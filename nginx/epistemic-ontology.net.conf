# nginx config for epistemic-ontology.net (+ .org and www variants)
#
# Serves the static site AND makes the ontology namespace IRIs dereferenceable
# with RDF content negotiation. Drop in as a server config included from the
# main nginx.conf `http { }` block (standard sites-available / conf.d layout,
# where `include mime.types;` is already in effect).
#
# Canonical host: https://epistemic-ontology.net (the apex). The other three
# names (www, .org, www.org) 301-redirect to it. The namespace IRIs minted at
# www.epistemic-ontology.net therefore resolve via one permanent 301 to the apex
# and then the 303 content negotiation.
#
# TLS: the certificate covers all four names
#   (epistemic-ontology.net, www.epistemic-ontology.net,
#    epistemic-ontology.org, www.epistemic-ontology.org).

# --- MIME type hash sizing --------------------------------------------------
# /etc/nginx/mime.types carries ~1000 entries, which overflows nginx's default
# types_hash_max_size of 1024: nginx then logs `could not build optimal
# types_hash` at every start and reload, and falls back to a non-optimal table
# (it also reports ignoring types_hash_bucket_size, which is a consequence, not
# a second problem). Cosmetic -- types still resolve correctly -- but noise in
# every `nginx -t` obscures real warnings.
#
# This belongs in http{} context, and this file IS http{} context: the main
# nginx.conf includes conf.d/*.conf from inside its http block. Setting it here
# rather than in nginx.conf keeps it under version control, where a package
# upgrade cannot quietly revert it. Safe against a duplicate-directive error so
# long as nginx.conf does not also set it -- it does not.
#
# UNVERIFIED that this silences the warning: it is what nginx's own message
# asks for, and the file parses with it (checked against nginx 1.24 in a
# harness reproducing the real include context), but the warning could not be
# reproduced off-server to confirm the effect. This workstation's mime.types
# has 92 entries against the server's 1002, and synthesizing 1100 entries did
# not trigger it either -- the condition depends on key-length packing against
# types_hash_bucket_size, not on entry count. Confirm with `nginx -t` on the
# server after this deploys; if the warning persists, raise to 4096 rather than
# assuming this line is doing anything.
types_hash_max_size 2048;

# --- Accept header -> serialization, per namespace IRI ----------------------
# Default is the HTML documentation directory; RDF media types get the Turtle.
# 303 (not 302): the namespace IRI names an ontology, not a document -- "the
# thing you asked about is not a document, but here is a document about it".
map $http_accept $rho_repr {
    default                             "/record-harm/";
    "~*text/turtle"                     "/record-harm/record-harm-ontology.ttl";
    "~*application/rdf\+xml"            "/record-harm/record-harm-ontology.ttl";
    "~*application/ld\+json"            "/record-harm/record-harm-ontology.ttl";
    "~*application/n-triples"           "/record-harm/record-harm-ontology.ttl";
}
map $http_accept $rec_repr {
    default                             "/record/";
    "~*text/turtle"                     "/record/record-ontology.ttl";
    "~*application/rdf\+xml"            "/record/record-ontology.ttl";
    "~*application/ld\+json"            "/record/record-ontology.ttl";
    "~*application/n-triples"           "/record/record-ontology.ttl";
}
map $http_accept $arith_repr {
    default                             "/arith/";
    "~*text/turtle"                     "/arith/arith.ttl";
    "~*application/rdf\+xml"            "/arith/arith.ttl";
    "~*application/ld\+json"            "/arith/arith.ttl";
    "~*application/n-triples"           "/arith/arith.ttl";
}

# --- HTTP (and bare IP) -> canonical HTTPS apex -----------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://epistemic-ontology.net$request_uri;
}

# --- HTTPS, non-canonical names -> 301 to the apex --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.epistemic-ontology.net
                epistemic-ontology.org www.epistemic-ontology.org;

    ssl_certificate     /etc/letsencrypt/live/epistemic-ontology.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epistemic-ontology.net/privkey.pem;
    # If certbot manages the deployed copy it will have added its TLS defaults
    # (protocols, ciphers, dhparam) to that file. Copying this one over the top
    # would drop them -- check the live file before overwriting, and uncomment:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://epistemic-ontology.net$request_uri;
}

# --- HTTPS, canonical apex: serves the site + dereferenceable IRIs ----------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name epistemic-ontology.net;

    ssl_certificate     /etc/letsencrypt/live/epistemic-ontology.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epistemic-ontology.net/privkey.pem;
    # If certbot manages the deployed copy it will have added its TLS defaults
    # (protocols, ciphers, dhparam) to that file. Copying this one over the top
    # would drop them -- check the live file before overwriting, and uncomment:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Note: the `could not build optimal types_hash` warning this server logs
    # at startup is addressed at the top of this file -- see that comment. An
    # earlier version of this note claimed it "cannot be fixed from here, it
    # needs types_hash_max_size in the http{} block of nginx.conf"; the premise
    # was wrong, since nginx.conf includes conf.d/*.conf from INSIDE http{}, so
    # this file is already http context (the `map` blocks above are themselves
    # http-only directives and would not parse otherwise).

    # `charset` only rewrites the types listed in charset_types, whose default
    # does NOT include text/turtle -- so .ttl would be served with no charset
    # parameter at all. Turtle is UTF-8 by specification; say so on the wire.
    charset utf-8;
    charset_types text/turtle application/rdf+xml application/ld+json
                  application/n-triples application/trig
                  text/xml text/plain application/atom+xml application/javascript;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Conservative hardening. No CSP frame-ancestors override is set here so the
    # RDF stays embeddable by third-party tooling; adjust if that changes.
    #
    # IMPORTANT: an add_header anywhere in a location REPLACES every add_header
    # inherited from this block. nginx has no "append" form, so any location
    # below that adds a header of its own must repeat these three. They are
    # deliberately spelled out rather than pulled into an include file, so this
    # config stays a single file to deploy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/turtle application/xml application/atom+xml
               application/rdf+xml application/ld+json application/n-triples
               application/javascript image/svg+xml;

    # --- Hash-namespace dereferencing --------------------------------------
    # A bare term-document IRI (no trailing slash, no extension) negotiates a
    # representation; `/record/`, `/arith/` and `/record-harm/` keep serving the
    # HTML documentation.
    #
    # CORS ON THE REDIRECT, not just on the target. A cross-origin fetch() in
    # CORS mode applies the CORS check to EVERY response in the chain, so a 303
    # without Access-Control-Allow-Origin is a network error even when the .ttl
    # it points at allows the origin. Browser RDF tooling naturally fetches the
    # namespace IRI -- i.e. it always starts at one of these redirects.
    location = /record-harm {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept" always;
        return 303 $rho_repr;
    }
    location = /record {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept" always;
        return 303 $rec_repr;
    }
    location = /arith {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept" always;
        return 303 $arith_repr;
    }

    # Every worked example declares its own permanent IRI, systematically:
    #   https://www.epistemic-ontology.net/record/examples/<name>#
    # Make those dereference to the Turtle. There is no per-example HTML page,
    # so this answers every Accept header with the RDF.
    location ~ "^/record/examples/([a-z0-9-]+)$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 303 /record/examples/$1.ttl;
    }

    # --- Moved files (kept permanently) ------------------------------------
    # The two examples that used to sit directly under /record/ before they were
    # regrouped under /record/examples/. Old links keep working -- and carry CORS
    # for the same redirect-chain reason as above.
    location = /record/cogito.ttl {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 301 /record/examples/cogito.ttl;
    }
    location = /record/historical-narrative.ttl {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 301 /record/examples/historical-narrative.ttl;
    }

    # --- RDF serializations -------------------------------------------------
    # Correct media type (nginx ships none for these, so they would otherwise be
    # text/plain), UTF-8, and CORS so RDF tooling in browsers and import-by-URL
    # from other ontologies can fetch them. The `types` block is scoped to this
    # location, so it does NOT disturb the global mime.types used for
    # .html/.css/.png/.ico.
    location ~ \.(ttl|rdf|owl|jsonld|nt|trig)$ {
        types {
            text/turtle                 ttl;
            application/rdf+xml         rdf owl;
            application/ld+json         jsonld;
            application/n-triples       nt;
            application/trig            trig;
        }
        # NOTE: an add_header in a location REPLACES every add_header inherited
        # from the server block, so the server-level headers are repeated in
        # each location that defines any of its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /feed.xml {
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        types { } default_type "application/atom+xml; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=1800" always;
    }
    location = /sitemap.xml {
        types { } default_type "application/xml; charset=utf-8";
    }

    # HTML must never be served stale. Without an explicit Cache-Control a
    # browser is ALLOWED to apply heuristic freshness (roughly 10% of the age
    # since Last-Modified) and reuse a page without asking -- which breaks the
    # fingerprinted-stylesheet contract: stale HTML points at a style.<sha>.css
    # that no longer exists, the request 404s, and the page renders unstyled.
    #
    # `no-cache` does not mean "do not store"; it means "revalidate before
    # reusing". With the ETag and Last-Modified already sent, that revalidation
    # is a 304 with an empty body, so the cost is one conditional request.
    location / {
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free assets: short cache, so a deploy is visible promptly.
    # The stylesheet is content-addressed by the build: style.<sha>.css. The URL
    # changes exactly when the bytes do, so it never needs revalidating -- cache
    # it for a year and mark it immutable. This is what stops a returning
    # visitor holding an old stylesheet against new markup.
    location ~ "^/style\.[0-9a-f]{10}\.css$" {
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The unfingerprinted name is still published so an old bookmark or an
    # external reference does not 404. Nothing this site generates links to it;
    # it keeps the short cache it always had.
    location = /style.css {
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location ~* \.(png|ico|svg|woff2)$ {
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
